<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momentum – Spontaneous Connections</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 min-h-screen text-white">
    <div id="app">
        <nav class="p-6 flex justify-between items-center backdrop-blur-md bg-white/10">
            <h1 class="text-3xl font-bold tracking-tight">Momentum</h1>
            <button class="px-4 py-2 bg-white/20 rounded-full hover:bg-white/30 transition">Login</button>
        </nav>
        <main class="container mx-auto p-6">
            <div class="text-center mt-20">
                <h2 class="text-5xl font-extrabold mb-4 animate-pulse">Seize the Moment</h2>
                <p class="text-xl mb-8">Create or join spontaneous events, right now.</p>
                <button class="px-8 py-3 bg-pink-500 rounded-full text-lg font-semibold hover:bg-pink-600 transform hover:scale-105 transition">Create an Event</button>
            </div>
            <div id="events-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mt-12"></div>
        </main>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
